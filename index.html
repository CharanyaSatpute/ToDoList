<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="todo-app" aria-labelledby="todo-title">
            <h1 id="todo-title">To Do List <img src="Images/icon.png" alt=""></h1>
            <form class="row" id="task-form">
                <label class="visually-hidden" for="input-box">New task</label>
                <input type="text" id="input-box" placeholder="Add your task" required>
                <button type="submit">Add</button>
            </form>
            <ul id="list-container" aria-label="Tasks"></ul>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
